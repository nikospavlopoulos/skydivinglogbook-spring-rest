###<= PROFILES =>###

spring.profiles.active=demo
#spring.profiles.active=dev
#spring.profiles.active=test

spring.application.name=skydivingrest

spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.data.jpa.repositories.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop

#spring.jpa.properties.jakarta.persistence.validation.mode=auto

## Support the import of the .env file
spring.config.import=optional:file:.env[.properties]

## JWT Security key Base64 ##
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

## Observability (Actuator) ##
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

## API Documentation (Swagger/OpenAPI) ##
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

## CORS Configuration ##
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
