name: SkydiveREST Tests

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["develop", "main"]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # Injecting GitHub Secrets and Variables as Environment Variables
    env:
      MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      MYSQL_USER: ${{ vars.MYSQL_USER }}
      MYSQL_DB: ${{ vars.MYSQL_DB }}
      MYSQL_HOST: ${{ vars.MYSQL_HOST }}
      MYSQL_PORT: ${{ vars.MYSQL_PORT }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      SWAGGER_ENABLED: ${{ vars.SWAGGER_ENABLED }}

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      # 3. Cache Gradle dependencies and wrapper
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle*', '**/settings.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 4. Ensure Gradlew is executable
      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      # 5. Run tests with detailed info
      - name: Run tests
        run: ./gradlew test --no-build-cache --continue --info

      # 6. Upload test result XML files
      - name: Upload JUnit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: build/test-results/test

      # 7. Upload test report HTML files
      - name: Upload test HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-test-report
          path: build/reports/tests/test

      # 8. Upload JaCoCo HTML report
      - name: Upload JaCoCo HTML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/jacocoHtml

      # 9. Upload JaCoCo XML report
      - name: Upload JaCoCo XML report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml-report
          path: build/reports/jacoco/test/jacocoTestReport.xml

